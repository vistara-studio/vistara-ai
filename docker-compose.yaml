
services:
  # PostgreSQL Database with PostGIS
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: vistara-ai-db
    environment:
      POSTGRES_USER: vistara
      POSTGRES_PASSWORD: vistara123
      POSTGRES_DB: vistara_ai
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - vistara-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vistara -d vistara_ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vistara AI Application
  app:
    build: .
    container_name: vistara-ai-app
    ports:
      - "5000:5000"
    environment:
      - GO_ENV=development
      - DATABASE_URL=postgres://vistara:vistara123@db:5432/vistara_ai?sslmode=disable
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=vistara_ai
      - DB_USER=vistara
      - DB_PASSWORD=vistara123
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL_NAME=gemini-2.5-flash
      - API_SECRET_KEY=vistara-ai-integration-key
      - JWT_SECRET=vistara-ai-secret-jwt-key
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - vistara-network
    volumes:
      - ./.env:/root/.env
    restart: unless-stopped

  # Redis (for caching, optional)
  redis:
    image: redis:7-alpine
    container_name: vistara-ai-redis
    ports:
      - "6379:6379"
    networks:
      - vistara-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  vistara-network:
    driver: bridge
