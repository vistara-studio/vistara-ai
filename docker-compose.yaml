version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: vistara-ai-db
    environment:
      POSTGRES_USER: vistara_user
      POSTGRES_PASSWORD: vistara_password
      POSTGRES_DB: vistara_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    networks:
      - vistara-network

  # Vistara AI Application
  app:
    build: .
    container_name: vistara-ai-app
    ports:
      - "5000:5000"
    environment:
      - GO_ENV=production
      - DATABASE_URL=postgres://vistara_user:vistara_password@db:5432/vistara_ai?sslmode=disable
      - PORT=5000
    depends_on:
      - db
    networks:
      - vistara-network
    volumes:
      - ./.env:/root/.env
    restart: unless-stopped

  # Redis (for caching, optional)
  redis:
    image: redis:7-alpine
    container_name: vistara-ai-redis
    ports:
      - "6379:6379"
    networks:
      - vistara-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  vistara-network:
    driver: bridge
